{% extends "http_error/base.html" %}
{% load i18n %}

{% block http_error_main %}
<h2>500</h2>
<h1 class="error-title">{% trans 'Oops! Something went wrong.' %}</h1>
<p class="error-message">
    <span>
        {% trans "An unexpected error has occurred on the server." %}
    </span>
</p>
{% endblock %}

{% block svg_image %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" style="width: 100%; max-width: 600px; height: auto; display: block; margin: 0 auto;">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f9fafb"/>
            <stop offset="100%" stop-color="#e5e7eb"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="600" height="300" rx="20" fill="url(#bg)" />

    <!-- Server stack -->
    <g transform="translate(200 40)">
        <rect x="0" y="0" width="200" height="50" rx="10" fill="#d1d5db"/>
        <rect x="0" y="70" width="200" height="50" rx="10" fill="#d1d5db"/>
        <rect x="0" y="140" width="200" height="50" rx="10" fill="#d1d5db"/>

        <!-- Slots -->
        <rect x="20" y="20" width="110" height="6" rx="3" fill="#9ca3af"/>
        <rect x="20" y="90" width="110" height="6" rx="3" fill="#9ca3af"/>
        <rect x="20" y="160" width="110" height="6" rx="3" fill="#9ca3af"/>

        <!-- Error LEDs -->
        <circle cx="170" cy="25" r="6" fill="#ef4444"/>
        <circle cx="170" cy="95" r="6" fill="#ef4444"/>
        <circle cx="170" cy="165" r="6" fill="#ef4444"/>
    </g>

    <!-- Warning icon -->
    <g transform="translate(270 215)">
        <polygon points="30,0 60,52 0,52" fill="#f59e0b"/>
        <rect x="27" y="18" width="6" height="18" rx="3" fill="#ffffff"/>
        <circle cx="30" cy="42" r="3" fill="#ffffff"/>
    </g>
</svg>
{% endblock %}
