{% extends "http_error/base.html" %}
{% load i18n %}

{% block http_error_main %}
<h2>404</h2>
<h1 class="error-title">{% trans 'Oops! Page not found.' %}</h1>
<p class="error-message">
    <span>
        {% trans "We could not find the page you were looking for." %}
    </span>
</p>
{% endblock %}
{% block send_bug %}
{% endblock %}

{% block svg_image %} 
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" style="width: 100%; max-width: 600px; height: auto;">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f9fafb"/>
            <stop offset="100%" stop-color="#e5e7eb"/>
        </linearGradient>

        <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f3f4f6"/>
            <stop offset="100%" stop-color="#d1d5db"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="600" height="300" rx="20" fill="url(#bg)" />

    <!-- Server -->
    <g transform="translate(180 45)">
        <rect x="0" y="0" width="240" height="60" rx="12" fill="#d1d5db"/>
        <rect x="0" y="80" width="240" height="60" rx="12" fill="#d1d5db"/>

        <rect x="25" y="25" width="130" height="8" rx="4" fill="#9ca3af"/>
        <rect x="25" y="105" width="130" height="8" rx="4" fill="#9ca3af"/>

        <circle cx="205" cy="30" r="7" fill="#9ca3af"/>
        <circle cx="205" cy="110" r="7" fill="#9ca3af"/>
    </g>

    <!-- Broken file -->
    <g transform="translate(265 170)">
        <!-- File base -->
        <path d="M10 0 h40 l20 20 v70 a10 10 0 0 1 -10 10 h-50 a10 10 0 0 1 -10 -10 v-80 a10 10 0 0 1 10 -10"
                    fill="url(#paper)"/>

        <!-- Fold -->
        <polygon points="50,0 70,20 50,20" fill="#e5e7eb"/>

        <!-- Crack -->
        <path d="M35 25 l-8 15 10 12 -6 18"
                    stroke="#6b7280"
                    stroke-width="3"
                    fill="none"
                    stroke-linecap="round"/>
    </g>
</svg>
{% endblock%}
