{% extends "http_error/base.html" %}
{% load i18n %}

{% block http_error_main %}
<h2>403</h2>
<h1 class="error-title">{% trans 'Access denied' %}!!</h1>
<p class="error-message">
    <span>
        {% trans "You do not have permission to access this page." %}
    </span>
</p>
{% endblock %}
{% block svg_image %}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" style="width: 100%; height: auto; max-width: 600px; display: block; margin: 0 auto;">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#f9fafb"/>
            <stop offset="100%" stop-color="#e5e7eb"/>
        </linearGradient>

        <linearGradient id="lockBody" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#9ca3af"/>
            <stop offset="100%" stop-color="#6b7280"/>
        </linearGradient>
    </defs>

    <!-- Background -->
    <rect width="600" height="300" rx="20" fill="url(#bg)" />

    <!-- Server -->
    <g transform="translate(180 50)">
        <rect x="0" y="0" width="240" height="60" rx="12" fill="#d1d5db"/>
        <rect x="0" y="80" width="240" height="60" rx="12" fill="#d1d5db"/>

        <rect x="25" y="25" width="130" height="8" rx="4" fill="#9ca3af"/>
        <rect x="25" y="105" width="130" height="8" rx="4" fill="#9ca3af"/>

        <circle cx="205" cy="30" r="7" fill="#ef4444"/>
        <circle cx="205" cy="110" r="7" fill="#ef4444"/>
    </g>

    <!-- Centered Lock -->
    <!-- Canvas center = 300, lock width = 100 → x = 250 -->
    <g transform="translate(250 175)">
        <!-- Shackle -->
        <path d="M30 35
             v-10
             a20 20 0 0 1 40 0
             v10"
            fill="none"
            stroke="#6b7280"
            stroke-width="8"
            stroke-linecap="round"/>

        <!-- Body -->
        <rect x="15" y="35" width="70" height="60" rx="12" fill="url(#lockBody)"/>

        <!-- Keyhole -->
        <circle cx="50" cy="62" r="6" fill="#f9fafb"/>
        <rect x="48" y="62" width="4" height="14" rx="2" fill="#f9fafb"/>
    </g>
</svg>
{% endblock %}
{% block send_bug %}
{% endblock %}
