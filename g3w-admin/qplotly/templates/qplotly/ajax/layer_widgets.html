{% load i18n %}
{% load qdjango_tags %}
<div id="layer_qplotlywidgets_{{ layer.id }}" style="margin-left:40px;">
  <table class="table">
    <thead>
      <tr>
        <th>{% trans 'Actions' %}</th>
        <th>{% trans 'Name' %}</th>
        <th>{% trans 'Type' %}</th>
        <th>{% trans 'Linked' %}</th>
      </tr>
    </thead>
    <tbody>
      {% for object in object_list %}
        <tr id="qdjango_project_layer_qplotlywidget_{{ object.slug }}">
          <td style="display: flex; flex-wrap: wrap; gap: 0 10px;"></td>
          <td>{{ object.pk }}</td>
          <td>
            <img
              width="16"
              height="16"
              style="object-fit: scale-down;"
              src="{% static 'svg/icons/'|add:object.type|add:'.svg' %}"
            />
            {{ object.type }}
          </td>
          <td>
            <input
              type="checkbox"
              {% if object|widget_linked_layer:layer %}checked{% endif %}
              value="{{ object.id }}"
              data-widget-type="linkWidget2Layer"
            />
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
