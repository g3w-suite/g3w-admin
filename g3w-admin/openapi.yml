      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DeployInfoData'
                required:
                - result
          description: ''
  /api/expression_eval/{project_id}/:
    post:
      operationId: api_expression_eval_create
      description: Evaluate a `QgsExpression` in the context of a project and an optional
        layer/feature form.
      summary: Evaluate a QGIS expression
      parameters:
      - in: path
        name: project_id
        schema:
          type: integer
        description: Numeric ID of the QGIS project (qdjango).
        required: true
      tags:
      - core
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpressionEvalRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExpressionEvalRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExpressionEvalRequestRequest'
        required: true
      security:
      - cookieAuth: []
