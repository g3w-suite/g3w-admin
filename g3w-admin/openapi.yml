openapi: 3.0.3
info:
  title: G3W-SUITE Admin API
  version: 3.11.doc_api-20260529145810
  description: 'REST API for the G3W-SUITE administration backend. Endpoints are grouped
    per Django app (core, client, qdjango, editing, OWS, caching, qplotly, qtimeseries,
    qes, filemanager, usersmanage, about). Most write endpoints return the standard
    envelope `{"result": bool, "data": ..., "error": ...}`.'
  contact:
    name: Gis3w
    url: https://g3wsuite.it
    email: info@gis3w.it
  license:
    name: MPL 2.0
    url: https://www.mozilla.org/en-US/MPL/2.0/
