{% load i18n %}
<div class="row form-buttons">
    <div class="col-md-12">
        {% if save %}
        <button class="btn btn-lg btn-success" type="submit">
            <i class="fa fa-save"></i>
            {% trans 'Save'%}
        </button>
        {% endif %}
        {% if redo %}
        <a class="btn btn-lg btn-default" data-widget-type="backHistory">
            <i class="fa fa-undo"></i>
            {% trans 'Redo/Back'%}
        </a>
        {% endif %}
    </div>
</div>
<script>
(function(){
    if (window.__g3wFormButtonsInit) return;
    window.__g3wFormButtonsInit = true;
    function init() {
        var bar = document.querySelector('.form-buttons');
        function adjust() {
            var rect = footer.getBoundingClientRect();
            var vh = window.innerHeight || document.documentElement.clientHeight;
            var overlap = Math.max(0, vh - rect.top);
            bar.style.bottom = overlap + 'px';
        }
        // Listen on window AND on AdminLTE content scrollers (if any).
        window.addEventListener('scroll', adjust, { passive: true });
        window.addEventListener('resize', adjust);
        document.querySelectorAll('.content-wrapper, .wrapper').forEach(function(el){
            el.addEventListener('scroll', adjust, { passive: true });
        });
        adjust();
        // Re-adjust shortly after init to account for late layout shifts
        // (web fonts, sidebar toggle animation, etc.).
        setTimeout(adjust, 150);
        setTimeout(adjust, 600);
    }
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
