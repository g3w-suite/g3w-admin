- model: userscripts.userscript
  fields:
    name: "(DRAFT) G3W-PORTAL custom element"
    type: "js"
    description: "(DRAFT) G3W-PORTAL custom element"
    match: ^/([a-z]{2})/(?!map|admin)/?
    run_at: "body_end"
    code: |
      customElements.define(
        'g3w-menu',
        class extends HTMLElement {
            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
                this.shadowRoot.innerHTML = `
                <style>
                    .float-nav {
                        position: fixed;
                        top: 1rem;
                        right: 20px;
                        z-index: 100;
                    }
                    .float-nav > a.menu-btn {
                        text-decoration: none;
                        display: block;
                        background-color: #cc3333;
                        color: white;
                        padding: 17px 19px 12px 19px;
                        text-align: center;
                        box-shadow: 2px 2px 8px #777;
                        border-radius: 300px;
                    }
                    .float-nav > a.menu-btn.active {
                        transition: background-color 250ms linear;
                        background-color: transparent;
                        box-shadow: none;
                    }
                    .float-nav > a.menu-btn.active > ul > li.line:nth-child(1) {
                        border-width: 2px;
                        transform: rotate(45deg) translate(4px, 6px);
                    }
                    .float-nav > a.menu-btn.active > ul > li.line:nth-child(2) {
                        visibility: hidden;
                    }
                    .float-nav > a.menu-btn.active > ul > li.line:nth-child(3) {
                        border-width: 2px;
                        transform: rotate(-45deg) translate(8px, -10px);
                    }
                    .float-nav > a.menu-btn > ul {
                        list-style: none;
                        padding: 0;
                        margin: 0;
                    }
                    .float-nav > a.menu-btn > ul > li.line {
                        border: 1px solid white;
                        width: 100%;
                        margin-bottom: 7px;
                        transition-duration: 0.1s;
                    }
                    .float-nav > a.menu-btn > .menu-txt {
                        width: 100%;
                        text-align: center;
                        font-size: 12px;
                        font-family: sans-serif;
                    }
                    
                    .main-nav {
                        display: none;
                        opacity: 0;
                        font-family: sans-serif;
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        transition: opacity 250ms;
                    }
                    .main-nav.active {
                        display: block;
                        opacity: 1;
                        transition: opacity 250ms;
                    }
                    .main-nav > ul {
                        width: 100%;
                        display: block;
                        list-style: none;
                        margin: 0;
                        padding: 0;
                        background-color: #cc3333;
                        box-shadow: 2px 2px 8px #777;
                        border-radius: 3px 3px 33.5px 3px;
                    }
                    .main-nav > ul > li > a {
                        text-decoration: none;
                        display: block;
                        font-weight: 200;
                        padding: 18px 80px 18px 18px;
                        color: white;
                    }
                    .main-nav > ul > li > a:hover {
                        font-weight: 400;
                    }
                    </style>
                    <div class="float-nav" onclick="this.parentNode.querySelectorAll('.main-nav, .menu-btn').forEach(d => d.classList.toggle('active')); return false;">
                        <a href="#" class="menu-btn">
                        <ul>
                            <li class="line"></li>
                            <li class="line"></li>
                            <li class="line"></li>
                        </ul>
                        <div class="menu-txt">menu</div>
                        </a>
                    </div>
                    
                    <div class="main-nav">
                        <ul>
                        <li><a href="#" data-route="group">Maps</a></li>
                        <li><a href="#" data-route="organization">Info</a></li>
                        </ul>
                    </div>
                `;
              this.shadowRoot.querySelectorAll('[data-route]').forEach(a => a.addEventListener('click', e => {
                e.preventDefault();
                document.getElementById('app').__vue_app__.config.globalProperties.$router.push({name: a.getAttribute('data-route') });
              }));
            }
      });
      document.body.insertAdjacentHTML('afterbegin', '<g3w-menu style="position: fixed; z-index: 100;"></g3w-menu>');