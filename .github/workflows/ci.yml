name: CI

# CI starts on every push and pull request. Each job below selects its own
# events: Django tests run for PRs and certain tags, JavaScript BDD tests run
# for all events, and the static-file check runs only for branch pushes.
# The jobs are independent except for test_static_files, which needs
# static_changes to report a matching file.
on: [push, pull_request]

jobs:
  # Django integration tests in Docker with QGIS and the Compose services.
  # Only PRs and tag pushes with no slash in the tag name run this job.
  # A newer run for the same ref cancels the previous Docker test run.
  ci_tests:
    if: github.event_name == 'pull_request' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '/'))
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-tests-${{ github.ref }}
      cancel-in-progress: true

    strategy:
      matrix:
        # Selects docker-compose.latest.yml; no LTR version is tested here.
        qgis_version: ['latest']

    steps:
      - uses: actions/checkout@v4

      - name: Extract branch name
        shell: bash
        run: echo "##[set-output name=branch;]$(echo ${GITHUB_REF#refs/heads/})"
        id: extract_branch

      # Cache the runner's pip downloads using all requirements files as the key.
      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Start the services and copy the checkout into the G3W Suite container.
      - name: Starting Docker compose
        run: docker compose -f docker-compose.${{ matrix.qgis_version }}.yml up -d

      - name: Copying code into the container
        run: |
          docker cp ./ "$(docker compose -f docker-compose.${{ matrix.qgis_version }}.yml ps -q g3w-suite)":/code

      # Install the main, Huey, Filemanager and Qplotly requirements in Docker.
      - name: Installing Python requirements
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/ && pip3 install -r requirements_docker.txt --break-system-packages && pip3 install -r requirements_huey.txt --break-system-packages"

      - name: Installing Filemanager Python requirements
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/ && pip3 install -r g3w-admin/filemanager/requirements.txt --break-system-packages"

      - name: Installing Qplotly Python requirements
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/ && pip3 install -r g3w-admin/qplotly/requirements.txt --break-system-packages"

      # build_suite.sh is currently a no-op. setup_suite.sh prepares Django,
      # including database migrations, collected static files and fixtures.
      - name: Building g3w-suite
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "/code/ci_scripts/build_suite.sh"

      - name: Setting up g3w-suite
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "/code/ci_scripts/setup_suite.sh"

      # Start Django in the background and wait up to 240 seconds for its port.
      - name: Starting Django
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py runserver 0.0.0.0:8000" &

      - name: Waiting for Django
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "wait-for-it -h localhost -p 8000 -t 240"

      # Run each Django app's tests separately so failures identify the suite.
      - name: Running g3w-admin core tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test core"

      - name: Running g3w-admin qdjango tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test qdjango"

      - name: Running g3w-admin usersmanage tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test usersmanage"

      - name: Running g3w-admin client tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test client"

      - name: Running g3w-admin editing tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test editing.tests"

      - name: Running g3w-admin filemanager tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test filemanager"

      - name: Running g3w-admin qplotly tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test qplotly"

      - name: Running g3w-admin qtimeseries tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test qtimeseries"

      - name: Running g3w-admin about tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test about"

      - name: Running g3w-admin qes tests
        run: |
          docker compose -f docker-compose.${{ matrix.qgis_version }}.yml exec -T g3w-suite sh -c "cd /code/g3w-admin && python3 manage.py test qes"

      # On failure, allow only the workflow actor to debug for up to 15 minutes.
      - name: Setup tmate session
        if: ${{ failure() }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 15
        with:
          limit-access-to-actor: true

  # Browser BDD tests run on every push and PR, independently of Docker tests.
  # They use Python 3.12 and headless Chromium; behave.ini selects Qtimeseries
  # by default, while the Qplotly feature directory is passed explicitly.
  # Run locally from the repository root:
  #   python -m pip install -r requirements_test.txt
  #   python -m playwright install chromium
  #   python -m behave
  #   python -m behave g3w-admin/qplotly/tests/features
  javascript_bdd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: python -m pip install -r requirements_test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m behave --junit --junit-directory g3w-admin/qtimeseries/tests/results
      - run: python -m behave g3w-admin/qplotly/tests/features --junit --junit-directory g3w-admin/qplotly/tests/results
      # Attempt to upload each JUnit report even if a preceding step fails.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qtimeseries-javascript-bdd-results
          path: g3w-admin/qtimeseries/tests/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qplotly-javascript-bdd-results
          path: g3w-admin/qplotly/tests/results

  # Detect **/static/** changes for branch pushes, not PRs or tag pushes.
  # Existing branches are compared with the pre-push commit. On the first push
  # of a non-default branch, paths-filter compares against the merge base with
  # the default branch; on an initial default-branch push all files are added.
  # These first-push rules can differ from GitHub's native paths filter.
  static_changes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      static: ${{ steps.changes.outputs.static }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for static file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.ref }}
          filters: |
            static:
              - '**/static/**'

  # Run only when static_changes finds a match. Applying concurrency here means
  # pushes without static changes do not cancel an in-progress static test.
  # The browser scenario opens the development expression map, substitutes
  # matching local static files, and checks application and editing-plugin
  # readiness. Unmatched files come from the remote server; JavaScript errors
  # are collected after navigation, not during the initial page load.
  test_static_files:
    needs: static_changes
    if: needs.static_changes.outputs.static == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: test-static-files-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Install Playwright browser
        run: playwright install chromium

      - name: Run tests
        run: python -m behave g3w-admin/client/tests/features
